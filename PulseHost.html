<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PulseHost</title>
<style>
:root{--bg:#070b16;--s1:#0d1424;--s2:#131c30;--bd:#1f2b45;--tx:#e6ecf8;--mu:#8a98b8;--cy:#22d3ee;--vi:#8b7cf6;--gr:#34d399;--am:#fbbf24;--rd:#f87171;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070b16;--tx:#e6ecf8}}
:root[data-theme="dark"]{--bg:#070b16}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
.mono,pre,code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--bd);background:var(--s1);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.02em}
.tag{font-size:11px;padding:2px 8px;border:1px solid var(--bd);border-radius:99px;color:var(--mu)}
.tag.am{color:var(--am);border-color:#6b5316}
main{flex:1;display:flex;min-height:0}
nav{width:190px;border-right:1px solid var(--bd);background:var(--s1);padding:10px;display:flex;flex-direction:column;gap:4px}
nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:8px;color:var(--mu);display:flex;justify-content:space-between}
nav button:hover{background:var(--s2)}nav button.on{background:#0e2a36;color:var(--cy)}
nav button:focus-visible,.btn:focus-visible{outline:2px solid var(--cy)}
section{flex:1;overflow:auto;padding:20px;min-width:0}
h1{font:700 26px/1.2 Georgia,serif;margin:0 0 4px}h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.sub{color:var(--mu);margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:12px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:14px;min-width:0}
.kpi{font-size:28px;font-weight:700}
.btn{cursor:pointer;border:1px solid var(--bd);background:var(--s2);color:var(--tx);border-radius:8px;padding:8px 14px;font:inherit}
.btn:hover{border-color:var(--cy)}.btn.p{background:var(--cy);color:#04141a;border-color:var(--cy);font-weight:600}
.btn.g{background:var(--gr);color:#04140d;border-color:var(--gr)}.btn.r{color:var(--rd)}.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.node{padding:6px 10px;border:1px solid var(--bd);border-radius:8px;font-size:12px;color:var(--mu);background:var(--s2)}
.node.run{border-color:var(--cy);color:var(--cy);animation:pulse 1.4s infinite}.node.ok{border-color:var(--gr);color:var(--gr)}
.node.bad{border-color:var(--rd);color:var(--rd)}.node.wait{border-color:var(--am);color:var(--am)}
@keyframes pulse{50%{box-shadow:0 0 0 4px #22d3ee22}}
@media (prefers-reduced-motion:reduce){.node.run{animation:none}}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--mu)}
.ok .dot,.dot.ok{background:var(--gr)}.dot.bad{background:var(--rd)}.dot.am{background:var(--am)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--mu);font-weight:500;font-size:12px}
pre{background:#050810;border:1px solid var(--bd);border-radius:8px;padding:10px;overflow:auto;max-height:260px;margin:6px 0;white-space:pre-wrap;word-break:break-word}
textarea,select{width:100%;background:#050810;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.tl{border-left:2px solid var(--bd);padding-left:12px;margin:0}.tl div{margin-bottom:8px}
.red{color:var(--rd)}.grn{color:var(--gr)}.amb{color:var(--am)}.vio{color:var(--vi)}.mu{color:var(--mu)}
#toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--s2);border:1px solid var(--gr);padding:10px 14px;border-radius:8px;display:none}
.ai{display:grid;grid-template-columns:230px 1fr 290px;gap:12px;height:calc(100vh - 140px);min-height:540px}.ai>*{display:flex;flex-direction:column;min-height:0;overflow:hidden}.aitabs{display:none;gap:6px;margin-bottom:10px}#chat{flex:1;overflow:auto;padding:4px}
.orb{--oc:#8b7cf6;width:52px;height:52px;border-radius:50%;position:relative;flex:none;background:radial-gradient(circle at 35% 30%,#b6abff,#5b4bd6 45%,#0b1a3c 85%);box-shadow:0 0 22px color-mix(in srgb,var(--oc) 45%,transparent);animation:br 5s ease-in-out infinite}.orb.big{width:120px;height:120px;margin:14px auto}
.orb::before{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(transparent,var(--oc),transparent 60%);opacity:0;-webkit-mask:radial-gradient(circle,transparent 62%,#000 64%);mask:radial-gradient(circle,transparent 62%,#000 64%)}.orb::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--oc);opacity:0}
.orb[data-s=interpreting]::before,.orb[data-s=planning]::before{opacity:1;animation:spin 2s linear infinite}.orb[data-s=executing]{--oc:#22d3ee;animation:br 1s ease-in-out infinite}.orb[data-s=listening]{--oc:#22d3ee}.orb[data-s=listening]::after,.orb[data-s=speaking]::after{opacity:1;animation:ring 1.6s ease-out infinite}.orb[data-s=speaking]{--oc:#22d3ee;animation:br .6s ease-in-out infinite}.orb[data-s=awaiting_approval]{--oc:#fbbf24}.orb[data-s=failed]{--oc:#f87171;animation:none}.orb[data-s=completed]{--oc:#34d399}.orb[data-s=awaiting_approval]::after,.orb[data-s=failed]::after,.orb[data-s=completed]::after{opacity:.9}
@keyframes br{50%{transform:scale(1.06)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(1.5);opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(6px)}}@keyframes dt{50%{opacity:.2}}
.m{margin:0 0 12px;padding:10px 12px;border-radius:12px;animation:rise .3s;max-width:92%}.m.u{margin-left:auto;background:#0e2a36}.m.a{background:var(--s2);border:1px solid var(--bd)}.lb{font-size:10px;letter-spacing:.1em;color:var(--cy);margin-top:8px}.lb:first-child{margin-top:0}
.tcard{border:1px solid var(--bd);border-radius:8px;padding:6px 8px;margin:8px 0;background:var(--s1)}.tcard summary{cursor:pointer}.b{font-size:11px;margin-left:6px}.appr{border:1px solid #6b5316;border-radius:10px;padding:10px;margin-top:10px;background:#1a1608}.acts{margin-top:8px}.ic{all:unset;cursor:pointer;color:var(--mu);font-size:12px;padding:2px 6px}.ic:hover{color:var(--cy)}
.ci{display:flex;align-items:center;border-radius:8px}.ci.act{background:#0e2a36}.ct{all:unset;cursor:pointer;flex:1;padding:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cl{margin-top:10px;overflow:auto}.pc{text-align:left;cursor:pointer;background:var(--s1);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit}.pc:hover{border-color:var(--cy)}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--cy);margin-right:4px;animation:dt 1s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@media (prefers-reduced-motion:reduce){.orb,.orb::before,.orb::after,.m,.dots i{animation:none!important}}
@media (max-width:900px){.ai{display:block;height:auto}.aitabs{display:flex}.ai>*{display:none}.ai>.on{display:flex;height:calc(100vh - 230px)}}
@media (max-width:700px){main{flex-direction:column}nav{width:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd)}nav button{white-space:nowrap}}
</style></head><body>
<header>
 <div class="logo"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13h5l3-8 5 16 3-8h6"/><circle cx="4" cy="20" r="2" stroke="#8b7cf6"/><circle cx="22" cy="6" r="2" stroke="#8b7cf6"/></svg>PulseHost</div>
 <span class="tag">Autonomous Travel &amp; Reliability Agent</span>
 <span class="tag am">Interactive simulation • Demo environment</span>
 <span class="tag" id="conn"></span>
</header>
<main><nav id="nav"></nav><section id="view"></section></main>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const uid=p=>p+'-'+Math.random().toString(36).slice(2,8).toUpperCase();
/* ---------- simulated backend state (persisted in this browser) ---------- */
const init=()=>({flags:{primaryDown:false},flight:{no:'PH204',route:'LIS → AMR (sample)',schedArr:870,delay:0,status:'On time'},
 passenger:{id:'DEMO-104',name:'Demo Traveller',budget:60,stepFree:true,bags:2,pax:2,allergy:'(private)'},
 hotel:{id:'HB-77',checkout:660,policyFreeUntil:840,lateFeePerHr:12,available:true,requested:null,status:'Confirmed'},
 shuttles:[{id:'SKY',name:'SkyLink Shuttle',role:'primary',price:38,cap:4,stepFree:true,health:'healthy'},
  {id:'CITY',name:'CityRide',role:'fallback',price:72,cap:6,stepFree:true,health:'healthy'},
  {id:'METRO',name:'MetroGo',role:'fallback',price:52,cap:4,stepFree:true,health:'healthy'},
  {id:'QUICK',name:'QuickVan',role:'fallback',price:41,cap:4,stepFree:false,health:'healthy'}],
 plan:null,actions:{},tokens:{},incidents:[],logs:[],audit:[],mcp:[],selected:null,pickup:null,approved:[]});
let db;try{db=JSON.parse(localStorage.getItem('ph')||'null')}catch(e){db=null}db=db||init();
const save=()=>{try{localStorage.setItem('ph',JSON.stringify(db))}catch(e){}};
const audit=(o)=>{db.audit.unshift({id:uid('EV'),ts:new Date().toISOString().slice(11,19),...o});save()};
const log=(svc,sev,msg,corr)=>{db.logs.push({ts:new Date().toISOString().slice(11,23),svc,sev,msg,corr})};
/* ---------- tool registry: validated inputs, measured duration, audited ---------- */
const T={};const def=(name,rw,desc,schema,ex,fn)=>T[name]={name,rw,desc,schema,ex,fn};
def('get_flight_status','read','Validated flight status, delay and schedule.',{required:{flightNumber:'string'}},{flightNumber:'PH204'},a=>{if(a.flightNumber!==db.flight.no)throw new Error('NOT_FOUND: unknown flight');return{...db.flight,estArrival:fmt(db.flight.schedArr+db.flight.delay),source:'sample-data (simulated)'}});
def('get_passenger_profile','read','Preferences and constraints relevant to recovery. Allergy details are never returned.',{required:{passengerId:'string'}},{passengerId:'DEMO-104'},a=>{const p=db.passenger;if(a.passengerId!==p.id)throw new Error('NOT_FOUND');return{id:p.id,budget:p.budget,stepFree:p.stepFree,bags:p.bags,pax:p.pax}});
def('check_hotel_policy','read','Late-checkout policy, availability and extra cost.',{required:{bookingId:'string',requestedCheckout:'number'}},{bookingId:'HB-77',requestedCheckout:1140},a=>{const h=db.hotel;if(a.bookingId!==h.id)throw new Error('NOT_FOUND');const extra=Math.max(0,Math.ceil((a.requestedCheckout-h.policyFreeUntil)/60))*h.lateFeePerHr;return{current:fmt(h.checkout),requested:fmt(a.requestedCheckout),available:h.available,extraCostUSD:extra,policy:'Free until '+fmt(h.policyFreeUntil)+', then $'+h.lateFeePerHr+'/hr'}});
def('find_shuttle_options','read','Evaluates shuttle options against budget, accessibility and capacity. provider=primary hits the primary provider only.',{required:{destination:'string',arrivalTime:'number',provider:['primary','fallbacks']}},{destination:'Hotel',arrivalTime:1110,provider:'fallbacks'},a=>{const p=db.passenger;if(a.provider==='primary'){if(db.flags.primaryDown)throw new Error('SHUTTLE_PROVIDER_TIMEOUT: SkyLink did not respond within 3000ms');return{options:[db.shuttles[0]]}}
 const ev=db.shuttles.filter(s=>s.role==='fallback').map(s=>{const why=[];if(s.price>p.budget)why.push('over budget $'+p.budget);if(p.stepFree&&!s.stepFree)why.push('not step-free');if(s.cap<p.bags+p.pax-1)why.push('capacity');return{id:s.id,name:s.name,price:s.price,eligible:!why.length,reasons:why.length?why:['meets budget, access, capacity']}});return{options:ev}});
def('check_service_health','read','Health of a simulated service (labelled simulated).',{required:{serviceName:'string'}},{serviceName:'shuttle-primary'},a=>{const m={'shuttle-primary':db.flags.primaryDown?'degraded':'healthy','shuttle-fallback':'healthy','hotel-service':'healthy','mcp-tools':'healthy'};if(!(a.serviceName in m))throw new Error('UNKNOWN_SERVICE');return{service:a.serviceName,status:m[a.serviceName],simulated:true}});
def('read_service_logs','read','Structured diagnostic logs for a service.',{required:{serviceName:'string',limit:'number'}},{serviceName:'shuttle-primary',limit:5},a=>db.logs.filter(l=>l.svc===a.serviceName).slice(-a.limit));
def('diagnose_incident','read','Rule-based diagnosis with evidence and stated uncertainty.',{required:{incidentId:'string'}},{incidentId:'INC-1'},a=>{const i=db.incidents.find(x=>x.id===a.incidentId);if(!i)throw new Error('NOT_FOUND');const ev=db.logs.filter(l=>l.svc==='shuttle-primary'&&l.sev!=='INFO');return{cause:'Primary shuttle provider unreachable (timeout)',evidence:ev.map(l=>l.ts+' '+l.msg),uncertainty:'Cause of provider outage unknown; only timeouts observed from our side.',nextSteps:['Fail over to an eligible fallback','Re-check primary later']}});
def('propose_recovery_plan','write','Creates a PENDING booking action and a server-side approval token.',{required:{journeyId:'string',shuttleId:'string'}},{journeyId:'J-PH204',shuttleId:'METRO'},a=>{const s=db.shuttles.find(x=>x.id===a.shuttleId);if(!s)throw new Error('NOT_FOUND: shuttle');const arr=db.flight.schedArr+db.flight.delay,co=1140,fee=Math.ceil((co-db.hotel.policyFreeUntil)/60)*db.hotel.lateFeePerHr;const id=uid('ACT'),tok=uid('TOK')+Math.random().toString(36).slice(2);db.tokens[id]=tok;db.actions[id]={id,status:'pending',shuttle:s.id,checkout:co,fee,pickup:arr+30};db.plan={journey:a.journeyId,actionId:id};audit({actor:'agent',action:'proposal created',tool:'propose_recovery_plan',outcome:'pending',approval:'required'});return{actionId:id,approvalToken:tok,summary:{newArrival:fmt(arr),checkout:fmt(co),shuttle:s.name,shuttleCost:s.price,hotelExtra:fee,total:s.price+fee},requiresApproval:true}});
def('approve_recovery_action','write','Validates a single-use server-side token, then applies the demo change.',{required:{actionId:'string',approvalToken:'string'}},{actionId:'ACT-…',approvalToken:'TOK-…'},a=>{const x=db.actions[a.actionId];if(!x)throw new Error('NOT_FOUND');if(x.status!=='pending')throw new Error('INVALID_STATE: action is '+x.status);if(db.tokens[a.actionId]!==a.approvalToken)throw new Error('FORBIDDEN: invalid approval token');delete db.tokens[a.actionId];x.status='approved';db.hotel.requested=x.checkout;db.hotel.status='Late checkout (simulated)';db.selected=x.shuttle;db.pickup=x.pickup;return{actionId:x.id,status:'approved'}});
def('verify_service_recovery','read','Post-action check of the selected provider and booking state.',{required:{serviceName:'string',incidentId:'string'}},{serviceName:'shuttle-fallback',incidentId:'INC-1'},a=>{const ok=db.selected&&db.shuttles.find(s=>s.id===db.selected).health==='healthy'&&db.hotel.requested!=null;return{service:a.serviceName,verified:!!ok,checks:['fallback healthy','hotel request recorded','shuttle selected']}});
const chk=(sch,a)=>{if(typeof a!=='object'||!a)return'arguments must be an object';for(const[k,t]of Object.entries(sch.required)){if(!(k in a))return'missing "'+k+'"';if(Array.isArray(t)?!t.includes(a[k]):typeof a[k]!==t)return'"'+k+'" must be '+(Array.isArray(t)?t.join('|'):t)}return null};
async function call(name,args,corr){const t=T[name],t0=performance.now(),rec={id:uid('CALL'),tool:name,args,corr:corr||'manual',rw:t?.rw};
 try{if(!t)throw new Error('UNKNOWN_TOOL');const e=chk(t.schema,args);if(e)throw new Error('INVALID_ARGS: '+e);await sleep(120);const r=t.fn(args);rec.ok=true;rec.result=r;return r}
 catch(e){rec.ok=false;rec.result={error:e.message};throw e}
 finally{rec.ms=Math.round(performance.now()-t0);db.mcp.unshift(rec);audit({actor:'agent',action:'tool call',tool:name,outcome:rec.ok?'success':'failure',corr:rec.corr,approval:rec.rw==='write'?'gated':'n/a'});save();if(cur==='mcp'||demo.running)draw()}}
/* ---------- signature demo orchestrator (deterministic, not an LLM) ---------- */
const NODES=['Alert received','Passenger context','Hotel policy','Shuttle availability','Incident detection','Fallback selection','Approval','Recovery verification'];
let demo={running:false,st:NODES.map(()=>'idle'),notes:[],summary:null,resolve:null,t0:0},cur='overview',selTool='get_flight_status';
const set=(i,s)=>{demo.st[i]=s;draw()},note=m=>{demo.notes.push(m);draw()};
async function runDemo(){if(demo.running)return;reset(true);demo={running:true,st:NODES.map(()=>'idle'),notes:[],summary:null,resolve:null,t0:performance.now()};go('overview');
 const corr=uid('CORR');let inc,fb,prop;
 try{set(0,'run');db.flight.delay=240;db.flight.status='Delayed 4h';audit({actor:'operator',action:'flight event: delayed 240m',outcome:'success',corr,approval:'n/a'});note('Event stored: PH204 delayed 4 hours');await sleep(500);set(0,'ok');
 set(1,'run');const fs=await call('get_flight_status',{flightNumber:'PH204'},corr);const pp=await call('get_passenger_profile',{passengerId:'DEMO-104'},corr);note('Delay '+fs.delay+'m, new arrival '+fs.estArrival+'. Budget $'+pp.budget+', step-free needed');set(1,'ok');
 set(2,'run');const hp=await call('check_hotel_policy',{bookingId:'HB-77',requestedCheckout:1140},corr);note('Hotel: late checkout to '+hp.requested+' available, extra $'+hp.extraCostUSD);set(2,'ok');
 set(3,'run');await sleep(300);db.flags.primaryDown=true;note('Backend flag set: primary shuttle provider outage (controlled)');log('shuttle-primary','ERROR','upstream timeout after 3000ms GET /availability',corr);log('shuttle-primary','ERROR','retry 1/1 failed: connect ETIMEDOUT',corr);
 try{await call('find_shuttle_options',{destination:'Hotel',arrivalTime:1110,provider:'primary'},corr)}catch(e){set(3,'bad');note('Tool failed: '+e.message)}
 set(4,'run');inc={id:'INC-1',code:'SHUTTLE_PROVIDER_TIMEOUT',sev:'high',status:'open',corr,opened:new Date().toISOString().slice(11,19)};db.incidents=[inc];db.shuttles[0].health='degraded';audit({actor:'incident-manager',action:'incident created '+inc.id,outcome:'success',corr,approval:'n/a'});
 const h=await call('check_service_health',{serviceName:'shuttle-primary'},corr);await call('read_service_logs',{serviceName:'shuttle-primary',limit:5},corr);const d=await call('diagnose_incident',{incidentId:'INC-1'},corr);inc.diagnosis=d;note('Health: '+h.status+'. Diagnosis: '+d.cause);set(4,'ok');
 set(5,'run');const so=await call('find_shuttle_options',{destination:'Hotel',arrivalTime:1110,provider:'fallbacks'},corr);const el=so.options.filter(o=>o.eligible).sort((a,b)=>a.price-b.price);inc.options=so.options;if(!el.length)throw new Error('NO_ELIGIBLE_FALLBACK');fb=el[0];note('Selected '+fb.name+' ($'+fb.price+'); rejected: '+so.options.filter(o=>!o.eligible).map(o=>o.name+' ('+o.reasons[0]+')').join(', '));set(5,'ok');
 set(6,'wait');prop=await call('propose_recovery_plan',{journeyId:'J-PH204',shuttleId:fb.id},corr);note('Approval needed: total +$'+prop.summary.total);draw();
 const decision=await new Promise(r=>demo.resolve=r);
 if(decision==='reject'){db.actions[prop.actionId].status='rejected';audit({actor:'operator',action:'rejected '+prop.actionId,outcome:'rejected',corr,approval:'rejected'});delete db.tokens[prop.actionId];set(6,'bad');demo.summary={status:'Partial: proposal rejected, no booking changed'};inc.status='open (no change applied)';finish();return}
 await call('approve_recovery_action',{actionId:prop.actionId,approvalToken:prop.approvalToken},corr);audit({actor:'operator',action:'approved '+prop.actionId,outcome:'success',corr,approval:'approved'});set(6,'ok');
 set(7,'run');const v=await call('verify_service_recovery',{serviceName:'shuttle-fallback',incidentId:'INC-1'},corr);
 if(v.verified){inc.status='mitigated (verified)';set(7,'ok');demo.summary={status:'Recovered and verified'}}else{set(7,'bad');demo.summary={status:'Partial: verification failed'}}
 }catch(e){note('Stopped: '+e.message);demo.summary={status:'Partial: '+e.message};const i=demo.st.indexOf('run');if(i>-1)set(i,'bad')}
 finish()}
function finish(){demo.running=false;demo.summary.ms=Math.round(performance.now()-demo.t0);demo.summary.tools=db.mcp.filter(m=>m.corr===db.incidents[0]?.corr).length;save();draw();toast(demo.summary.status)}
const decide=d=>{if(demo.resolve){demo.resolve(d);demo.resolve=null}else if(db.plan){d==='approve'?aiApprove(db.plan.actionId):aiReject(db.plan.actionId)}};
function reset(q){db=init();demo={running:false,st:NODES.map(()=>'idle'),notes:[],summary:null,resolve:null,t0:0};save();if(!q){toast('Demo reset');draw()}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
/* ---------- views ---------- */
const pages=[['overview','Overview'],['assistant','PulseHost AI'],['journey','Journey Operations'],['incident','Incident Center'],['mcp','MCP Explorer (sim)'],['audit','Activity & Audit']];
const go=p=>{cur=p;draw()};

function appr(id){const a=db.actions[id];if(!a)return'<div class="appr mu">Proposal expired (demo was reset).</div>';const s=db.shuttles.find(x=>x.id===a.shuttle),i=db.incidents[0],ev=(i?.options||[]).map(o=>o.name+(o.eligible?' ✓':' ✗')).join(', ');
 return`<div class="appr"><div class="amb" style="font-size:11px;letter-spacing:.1em">PROPOSED ACTION</div><b>Switch to an alternative shuttle provider</b><table><tr><td>Original</td><td>SkyLink (${db.shuttles[0].health})</td></tr><tr><td>Proposed</td><td>${esc(s.name)}</td></tr><tr><td>Pickup</td><td>${fmt(a.pickup)}</td></tr><tr><td>Estimated cost</td><td>$${s.price} shuttle + $${a.fee} late checkout = $${s.price+a.fee}</td></tr><tr><td>Budget impact</td><td>Shuttle $${s.price} of $${db.passenger.budget} budget</td></tr><tr><td>Reason</td><td>Cheapest option meeting budget, step-free access and capacity</td></tr><tr><td>Evidence</td><td>${esc(ev)}</td></tr><tr><td>Uncertainty</td><td>Outage cause unknown; fallback health is simulated</td></tr></table>`+(a.status==='pending'?`<div class="row"><button class="btn g" onclick="aiApprove('${id}')">Approve action</button><button class="btn r" onclick="aiReject('${id}')">Reject</button><button class="btn" onclick="aiApprove('${id}',1)">Test invalid token</button></div>`:`<div class="mu">Status: <b>${a.status}</b></div>`)+'</div>'}
function toolCard(t,i,j){return`<details class="tcard"><summary><span class="mono">${t.tool}</span><span class="b ${t.st==='ok'?'grn':t.st==='bad'?'red':'amb'}">${{running:'Running',ok:'Succeeded',bad:'Failed'}[t.st]}</span>${t.ms!=null?` <span class="mu mono">${t.ms}ms</span>`:''}</summary><div class="mu">${esc(t.desc||'')}</div><pre>${esc(JSON.stringify(t.args,null,1))}</pre><pre>${esc(JSON.stringify(t.out??'…',null,1))}</pre><button class="btn" onclick="cp(${i},${j})">Copy JSON</button></details>`}
const cb=t=>{try{navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>toast('Copy blocked by browser'))}catch(e){toast('Copy unavailable')}};
const cp=(i,j)=>{const t=conv().msgs[i].tools[j];cb(JSON.stringify({args:t.args,out:t.out},null,1))},cpm=i=>cb(conv().msgs[i].S.map(s=>s[0]+': '+s[1]).join('\n'));
function speakMsg(m){if(!('speechSynthesis' in window)){A.vnote='Text-to-speech is unavailable in this browser.';return draw()}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(m.S.map(s=>s[0]+'. '+s[1].replace(/\*\*|`/g,'')).join(' '));u.onstart=()=>{A.speaking=true;draw()};u.onend=u.onerror=()=>{A.speaking=false;draw()};speechSynthesis.speak(u)}
const stopSpeak=()=>{try{speechSynthesis.cancel()}catch(e){}A.speaking=false;draw()};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function mic(){if(A.listening){A.rec&&A.rec.stop();return}if(!SR){A.vnote='Voice input is not supported in this browser. Typing works fully.';return draw()}
 try{const r=new SR();A.rec=r;r.lang='en-US';r.onstart=()=>{A.listening=true;A.vnote='Listening… tap the mic to stop.';draw()};r.onresult=e=>send(e.results[0][0].transcript);r.onerror=e=>{A.vnote=(e.error==='not-allowed'||e.error==='service-not-allowed')?'Microphone permission denied. You can keep typing.':'Voice error: '+e.error;A.listening=false;draw()};r.onend=()=>{A.listening=false;draw()};r.start()}catch(e){A.vnote='Could not start voice input: '+e.message;draw()}}
function aiView(){const c=conv(),os=A.listening?'listening':A.speaking?'speaking':A.state,msgs=c?c.msgs:[],tools=msgs.flatMap(m=>m.tools||[]).slice(-8).reverse(),inc=db.incidents[0],pa=Object.values(db.actions).filter(a=>a.status==='pending');
 const last=msgs[msgs.length-1],typing=A.busy&&last&&last.role==='ai'&&!(last.S||[]).length;
 const left=`<aside class="card ${A.tab==='hist'?'on':''}"><button class="btn p" onclick="newConv()">+ New conversation</button><div class="cl">${AI.convs.map(x=>`<div class="ci ${x.id===AI.active?'act':''}">${A.ren===x.id?`<input id="rn" value="${esc(x.title)}" style="flex:1;min-width:0" onkeydown="if(event.key==='Enter')renC('${x.id}',this.value)" onblur="A.ren=null;draw()">`:`<button class="ct" onclick="pick('${x.id}')">${esc(x.title)}</button>`}<button class="ic" title="Rename" onclick="A.ren='${x.id}';draw();setTimeout(()=>$('#rn')&&$('#rn').focus())">✎</button><button class="ic" title="Delete" onclick="delC('${x.id}')">${A.del===x.id?'Confirm?':'✕'}</button></div>`).join('')||'<p class="mu">No conversations yet.</p>'}</div></aside>`;
 const body=msgs.length?msgs.map((m,i)=>m.role==='user'?`<div class="m u">${md(m.text)}</div>`:`<div class="m a">${(m.S||[]).map(s=>`<div class="lb">${s[0]}</div><div>${md(s[1])}</div>`).join('')}${(m.tools||[]).map((t,j)=>toolCard(t,i,j)).join('')}${m.approval?appr(m.approval):''}${(m.S||[]).length?`<div class="acts"><button class="ic" onclick="cpm(${i})">Copy</button><button class="ic" onclick="speakMsg(conv().msgs[${i}])">Read aloud</button>${m.retry?`<button class="ic" onclick="send(conv().msgs[${i}].retry)">Retry</button>`:''}</div>`:''}</div>`).join('')+(typing?'<div class="dots"><i></i><i></i><i></i></div>':''):`<div style="text-align:center"><div class="orb big" data-s="${os}"></div><h1>Good afternoon. What can I help you resolve?</h1><div class="sub">Coordinate disrupted journeys, investigate service failures and recover operations through one conversation.</div><div class="grid">${P.map((p,i)=>`<button class="pc" onclick="send(P[${i}])">${p}</button>`).join('')}</div></div>`;
 const mid=`<div class="card ${A.tab==='chat'?'on':''}"><div style="display:flex;gap:12px;align-items:center;margin-bottom:8px"><div class="orb" data-s="${os}"></div><div style="flex:1"><b style="font-size:18px">PulseHost AI</b><div class="mu">Your intelligent travel and reliability agent.</div></div><span class="tag"><span class="dot ${A.state==='failed'?'bad':A.busy?'am':'ok'}"></span>${A.busy?SL[A.state]:'Demo Agent Ready'}</span></div><div class="row" style="margin-bottom:6px"><span class="tag">Conversational assistant simulation</span><span class="tag">Demo Agent — deterministic orchestration</span></div><div id="chat" aria-live="polite">${body}</div><div class="mu" style="font-size:12px">${esc(A.vnote)}</div><textarea id="msg" rows="2" aria-label="Message" placeholder="Ask PulseHost AI…" ${A.busy?'disabled':''} onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea><div class="row" style="margin:8px 0 0;align-items:center"><button class="btn p" onclick="send()" ${A.busy?'disabled':''}>${A.busy?'Working…':'Send'}</button><button class="btn" onclick="mic()" aria-label="Voice input">${A.listening?'■ Stop':'🎤 Mic'}</button>${A.speaking?'<button class="btn" onclick="stopSpeak()">Stop audio</button>':''}<label class="mu"><input type="checkbox" ${A.speak?'checked':''} onchange="A.speak=this.checked"> Read replies aloud</label><span class="mu" style="font-size:12px">Enter to send · Shift+Enter for newline</span></div></div>`;
 const right=`<aside class="card ${A.tab==='act'?'on':''}" style="overflow:auto"><h3>Live agent activity</h3><div class="mono">State: <b>${SL[A.state]}</b></div><div class="mu" style="word-break:break-word">Task: ${esc(A.task||'—')}</div><h3 style="margin-top:12px">Tool calls</h3>${tools.map(t=>`<div class="mono"><span class="dot ${t.st==='ok'?'ok':t.st==='bad'?'bad':'am'}"></span>${t.tool} <span class="mu">${t.ms!=null?t.ms+'ms':'…'}</span></div>`).join('')||'<span class="mu">None yet.</span>'}<h3 style="margin-top:12px">Incident</h3>${inc?`<span class="mono">${inc.id}</span> ${esc(inc.status)}`:'<span class="mu">None</span>'}<h3 style="margin-top:12px">Pending approvals</h3><b class="amb">${pa.length}</b><h3 style="margin-top:12px">Service health</h3><div><span class="dot ${db.shuttles[0].health==='healthy'?'ok':'bad'}"></span>Shuttle primary ${db.shuttles[0].health}</div><div><span class="dot ok"></span>MCP tools (sim)</div><h3 style="margin-top:12px">Timeline</h3><div class="tl">${db.audit.slice(0,6).map(a=>`<div class="mono">${a.ts} ${esc(a.action)}</div>`).join('')||'<span class="mu">Empty</span>'}</div></aside>`;
 return`<div class="aitabs">${[['hist','History'],['chat','Chat'],['act','Activity']].map(t=>`<button class="btn ${A.tab===t[0]?'p':''}" onclick="A.tab='${t[0]}';draw()">${t[1]}</button>`).join('')}</div><div class="ai">${left}${mid}${right}</div>`}
draw();
</script></body></html>
